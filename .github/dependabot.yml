version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # pnpm workspace root (pnpm-lock.yaml covers apps/* and packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /services/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /services/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
