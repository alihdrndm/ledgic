name: Bug report
description: Something in the code or the live demo is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security vulnerabilities must not be reported here.** See [SECURITY.md](https://github.com/alihdrndm/ledgic/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app (apps/web)
        - Core API / orchestrator (services/core)
        - AI extraction, resolution or copilot
        - MCP server
        - Database (migrations, RLS, RPCs, views)
        - Hosted demo
        - Docs
        - Other
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Hosted demo (ledgic-pearl.vercel.app)
        - Local stack
        - CI
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any invoice number or screen involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste error output; it is formatted as code automatically. Redact tokens, cookies and keys.
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or date
      description: The commit SHA for a local stack, or the date and time (with time zone) for the hosted demo.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node / pnpm / Python / uv / Docker versions as relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have removed any API keys, tokens, passwords, or personal data from this report
          required: true
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability (those are reported privately, see SECURITY.md)
          required: true
