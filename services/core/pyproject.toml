[project]
name = "ledgic-core"
version = "0.1.0"
description = "Ledgic core service: durable AP pipeline orchestrator, AI agents, RAG and MCP server"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "apscheduler>=3.10,<4",
  "rapidfuzz>=3.9",
  "scipy>=1.13",
  "numpy>=1.26",
  "pillow>=10.4",
  "imagehash>=4.3",
  "pypdfium2>=4.30",
  "reportlab>=4.2",
  "httpx>=0.27",
  "openai>=1.50",
  "openai-agents>=0.2",
  "mcp>=1.12",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "pyjwt>=2.9",
]

[project.scripts]
ledgic-mcp = "app.mcp.stdio:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a running local Supabase (npx supabase start)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
